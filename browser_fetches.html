<script>
'use strict';

/* =========================================================================
 *  CONFIG — edit this section
 * ========================================================================= */

const CCC_JSON_URL  = 'https://raw.githubusercontent.com/Hrjcushghdsj/catechism/refs/heads/main/ccc.json';
const REFS_JSON_URL = 'https://raw.githubusercontent.com/Hrjcushghdsj/catechism/refs/heads/main/references.json';

const CCC_JSON_INLINE  = null;
const REFS_JSON_INLINE = null;

const EXPLICIT_XREFS = {
  // 385: [283, 293],
};

const $ = (sel, root = document) => root.querySelector(sel);

const state = {
  currentId: null,
  order: [],
  pageMap: {},
  tocMap: {},
  cccMap: {},
  backlinks: {},
  searchData: {},
  data: null,
  refsMap: {},
  lastPageOpts: null,
  // theme — these are placeholder initial values; setupTheme() replaces them
  // from localStorage or from the CSS defaults (`--default-hue`,
  // `--default-contrast`) before the first paint of themed UI.
  themeMode: 'light',
  contrast: 0,
  hue: 30,
  // advanced search
  searchOpts: {
    match: 'contains',   // 'contains' | 'whole' | 'regex'
    logic: 'all',        // 'all' | 'any' | 'phrase'
    caseSensitive: false,
  },
  // embedder support — cached raw ?embed= value (undefined = not yet read)
  embedRaw: undefined,
};

const els = {};
let tooltipEl = null;
let searchTimer = null;
let paraMenuEl = null;
let paraMenuTarget = null;

/* ------------------------------------------------------------------ *
 *  Boot
 * ------------------------------------------------------------------ */
document.addEventListener('DOMContentLoaded', init);

async function init() {
  els.tree         = $('#tree-container');
  els.page         = $('#page');
  els.search       = $('#search');
  els.searchResults = $('#search-results');
  els.searchWrap   = $('#search-wrap');
  els.searchDropdown = $('#search-dropdown');
  els.advToggle    = $('#adv-toggle');
  els.advPanel     = $('#advanced-search');
  els.advHint      = $('#adv-hint');
  els.advLogicGroup = $('#adv-logic-group');
  els.sidebar      = $('#sidebar');
  els.backdrop     = $('#backdrop');
  els.menuToggle   = $('#menu-toggle');
  els.prev         = $('#prev');
  els.next         = $('#next');
  els.pagerLabel   = $('#pager-label');
  els.previewPane  = $('#preview-pane');
  els.previewTitle = $('#preview-title');
  els.previewBody  = $('#preview-body');

  // theme dialog
  els.themeBtn     = $('#theme-btn');
  els.themeModal   = $('#theme-modal');
  els.bgRange      = $('#bg-range');
  els.bgNumber     = $('#bg-number');
  els.hueRange     = $('#hue-range');
  els.hueNumber    = $('#hue-number');
  els.modeButtons  = Array.from(document.querySelectorAll('#theme-modal .segmented button'));

  setupTheme();
  bindUI();

  // ---- Catechism text ----
  let data = parseMaybeJson(CCC_JSON_INLINE);

  if (!data && CCC_JSON_URL) {
    try {
      data = await fetchJson(CCC_JSON_URL);
    } catch (err) {
      console.warn('[Catechism] Could not load ccc JSON from URL:', err.message);
    }
  }

  if (!data) {
    showLoadError(new Error(
      'Could not load the Catechism JSON. ' +
      (CCC_JSON_INLINE
        ? 'Inline contents were provided but could not be parsed.'
        : 'Configure CCC_JSON_INLINE or CCC_JSON_URL in the CONFIG section.')
    ));
    return;
  }

  safeStart(data);
}

function safeStart(data) {
  try {
    startWithData(data);
  } catch (e) {
    console.error('[Catechism] Render error:', e);
    els.page.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'error';
    box.innerHTML = '<h2>Could not display the Catechism</h2>' +
      '<p>See the browser console for details. The data was loaded, but an error occurred while rendering it.</p>';
    els.page.appendChild(box);
  }
}

function startWithData(data) {
  state.data = data;
  buildIndexes();
  renderTree();

  const inlineRefs = parseMaybeJson(REFS_JSON_INLINE);
  if (inlineRefs) state.refsMap = normalizeRefs(inlineRefs);

  routeInitial();

  if (!inlineRefs) loadRefsInBackground();
}

/* ------------------------------------------------------------------ *
 *  Loading helpers
 * ------------------------------------------------------------------ */
function parseMaybeJson(value) {
  if (value == null) return null;
  if (typeof value === 'string') {
    const s = value.trim();
    if (!s) return null;
    try {
      return JSON.parse(s);
    } catch (e) {
      console.warn('[Catechism] Inline JSON could not be parsed:', e.message);
      return null;
    }
  }
  if (typeof value === 'object') return value;
  return null;
}

async function fetchJson(url) {
  if (!url) throw new Error('No URL configured');
  const res = await fetch(url, { cache: 'no-cache' });
  if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
  return res.json();
}

/* ---- References data ---- */
async function loadRefsInBackground() {
  if (REFS_JSON_URL) {
    try {
      const raw = await fetchJson(REFS_JSON_URL);
      applyRefsData(raw);
      return;
    } catch (e) {
      console.warn('[Catechism] Could not load references JSON from URL:', e.message);
    }
  }
  showRefsBanner();
}

function applyRefsData(raw) {
  if (!raw || typeof raw !== 'object') return;
  state.refsMap = normalizeRefs(raw);
  removeRefsBanner();

  if (state.currentId) {
    const content = document.getElementById('content');
    const top = content ? content.scrollTop : 0;
    const opts = Object.assign({}, state.lastPageOpts || {}, { skipScroll: true });
    renderPage(state.currentId, opts);
    if (content) content.scrollTop = top;
  }
}

function normalizeRefs(raw) {
  const map = {};
  if (!raw || typeof raw !== 'object') return map;

  for (const key of Object.keys(raw)) {
    const n = toInt(key);
    if (n == null) continue;
    const entry = raw[key] || {};
    map[n] = {
      references: normalizeEntryList(entry.references),
      referencedBy: normalizeEntryList(
        entry['referenced by'] || entry.referenced_by || entry.referencedBy
      ),
    };
  }
  return map;
}

function normalizeEntryList(list) {
  const out = [];
  if (!Array.isArray(list)) return out;

  for (const item of list) {
    if (Array.isArray(item)) {
      if (item.length >= 2) {
        const a = toInt(item[0]);
        const b = toInt(item[1]);
        if (a != null && b != null) {
          out.push({ start: Math.min(a, b), end: Math.max(a, b) });
        }
      }
    } else {
      const n = toInt(item);
      if (n != null) out.push({ start: n, end: n });
    }
  }
  return out;
}

function toInt(v) {
  if (typeof v === 'number' && Number.isFinite(v)) return Math.trunc(v);
  if (typeof v === 'string' && /^\d+$/.test(v.trim())) return parseInt(v, 10);
  return null;
}

/* ---- References banner ---- */
function showRefsBanner() {
  if (document.getElementById('refs-banner')) return;

  const banner = document.createElement('div');
  banner.id = 'refs-banner';

  const msg = document.createElement('span');
  msg.innerHTML = 'Cross-reference data (<code>references.json</code>) is not loaded. ' +
                  'Paragraph cross-links are unavailable.';
  banner.appendChild(msg);

  const label = document.createElement('label');
  label.className = 'refs-btn';
  label.textContent = 'Select references.json';

  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.addEventListener('change', () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let raw;
      try {
        raw = JSON.parse(reader.result);
      } catch (e) {
        alert('That file is not valid JSON: ' + e.message);
        return;
      }
      applyRefsData(raw);
    };
    reader.readAsText(file);
  });

  label.appendChild(input);
  banner.appendChild(label);

  const content = document.getElementById('content');
  if (content) content.insertBefore(banner, content.firstChild);
}

function removeRefsBanner() {
  const b = document.getElementById('refs-banner');
  if (b) b.remove();
}

/* ---- Catechism load error ---- */
function showLoadError(err) {
  els.page.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'error';
  box.innerHTML = `
    <h2>Could not load the Catechism</h2>
    <p>${escapeHtml(String(err && err.message ? err.message : err))}</p>
    <p>Set <code>CCC_JSON_INLINE</code> or <code>CCC_JSON_URL</code> at the top of the
       script, or select the file manually:</p>
  `;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.addEventListener('change', () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let data;
      try {
        data = JSON.parse(reader.result);
      } catch (e) {
        alert('That file is not valid JSON: ' + e.message);
        return;
      }
      safeStart(data);
    };
    reader.readAsText(file);
  });
  box.appendChild(input);
  els.page.appendChild(box);
}

/* ------------------------------------------------------------------ *
 *  Indexing
 * ------------------------------------------------------------------ */
function mergeParagraphFragments(page) {
  const src = page.paragraphs;
  if (!Array.isArray(src) || src.length < 2) return;

  const hasLeadingCcc = p => {
    const e = p && p.elements && p.elements[0];
    return !!(e && e.type === 'ref-ccc' && typeof e.ref_number === 'number');
  };

  const isHeadingLike = p => {
    const m = (p.elements || []).filter(e => e.type !== 'spacer');
    if (!m.length) return false;
    return m.every(e => e.type === 'text' && e.attrs &&
                        (e.attrs.heavy_header || e.attrs.b));
  };

  const out = [];
  for (const p of src) {
    const prev = out[out.length - 1];
    const canMerge =
      prev &&
      hasLeadingCcc(prev) &&
      !hasLeadingCcc(p) &&
      !isHeadingLike(p) &&
      !isHeadingLike(prev);

    if (canMerge) {
      const prevElems = prev.elements || (prev.elements = []);
      const curElems  = p.elements || [];
      const last      = prevElems[prevElems.length - 1];
      const first     = curElems[0];

      if (last && first && last.type === 'text' && first.type === 'text' &&
          !/\s$/.test(last.text || '') && !/^\s/.test(first.text || '')) {
        prevElems.push({ type: 'text', text: ' ' });
      }
      for (const el of curElems) prevElems.push(el);
    } else {
      out.push(Object.assign({}, p, {
        elements: (p.elements || []).slice(),
        attrs: p.attrs ? Object.assign({}, p.attrs) : p.attrs,
      }));
    }
  }
  page.paragraphs = out;
}

function buildIndexes() {
  const data = state.data;

  // Insert here — clean the data once, up front
  for (const id in data.page_nodes) {
    const paras = data.page_nodes[id].paragraphs;
    while (
      paras.length > 0 &&
      paras[paras.length - 1].elements.length === 1 &&
      paras[paras.length - 1].elements[0].type === "spacer"
    ) {
      paras.pop();
    }
  }
  state.pageMap = data.page_nodes || {};
  state.tocMap = data.toc_nodes || {};
  state.order = [];
  state.cccMap = {};
  state.backlinks = {};
  state.searchData = {};

  const walk = (nodes) => {
    if (!nodes) return;
    for (const n of nodes) {
      if (state.pageMap[n.id]) state.order.push(n.id);
      walk(n.children);
    }
  };
  walk(data.toc_link_tree);

  const seen = new Set(state.order);
  for (const id in state.pageMap) {
    if (!seen.has(id)) state.order.push(id);
  }

  for (const id of state.order) {
    mergeParagraphFragments(state.pageMap[id]);
  }

  for (const id of state.order) {
    const page = state.pageMap[id];
    const paras = [];

    (page.paragraphs || []).forEach((p, pi) => {
      let text = '';
      let firstCcc = null;

      for (const el of (p.elements || [])) {
        if (el.type === 'text') text += el.text;
        else if (el.type === 'ref-ccc' && firstCcc === null) firstCcc = el.ref_number;
      }

      text = text.trim();
      if (text) paras.push({ idx: pi, text });

      if (firstCcc !== null && state.cccMap[firstCcc] === undefined) {
        state.cccMap[firstCcc] = { pageId: id, paraIndex: pi };
      }
    });

    state.searchData[id] = paras;
  }

  for (const id of state.order) {
    const page = state.pageMap[id];
    (page.paragraphs || []).forEach(p => {
      for (const el of (p.elements || [])) {
        if (el.type !== 'ref-ccc') continue;
        const target = state.cccMap[el.ref_number];
        if (target && target.pageId !== id) {
          if (!state.backlinks[target.pageId]) state.backlinks[target.pageId] = new Set();
          state.backlinks[target.pageId].add(id);
        }
      }
    });
  }
}

/* ------------------------------------------------------------------ *
 *  Cross-reference helpers
 * ------------------------------------------------------------------ */
function getParaNumber(para) {
  const els = para && para.elements;
  if (!Array.isArray(els)) return null;
  for (const el of els) {
    if (el && el.type === 'ref-ccc' && typeof el.ref_number === 'number') {
      return el.ref_number;
    }
  }
  return null;
}

function collectReferencesFor(ownNum, page, para) {
  const out = [];
  const covered = (n) => out.some(e => n >= e.start && n <= e.end);

  if (ownNum != null && state.refsMap[ownNum]) {
    for (const e of state.refsMap[ownNum].references) {
      if (e.start === ownNum && e.end === ownNum) continue;
      out.push(e);
    }
  }

  const auto = extractCrossReferences(page, para);
  for (const n of auto) {
    if (n === ownNum) continue;
    if (covered(n)) continue;
    out.push({ start: n, end: n });
  }

  return out;
}

function getReferencedBy(ownNum) {
  if (ownNum == null) return [];
  const data = state.refsMap[ownNum];
  if (!data) return [];
  return data.referencedBy.filter(e => !(e.start === ownNum && e.end === ownNum));
}

function extractCrossReferences(page, para) {
  const refs = new Set();
  const elements = Array.isArray(para.elements) ? para.elements : [];
  const ownNumber = elements[0] && elements[0].type === 'ref-ccc'
    ? elements[0].ref_number : null;

  if (ownNumber != null && Array.isArray(EXPLICIT_XREFS[ownNumber])) {
    EXPLICIT_XREFS[ownNumber].forEach(n => {
      if (state.cccMap[n]) refs.add(n);
    });
  }

  if (Array.isArray(para.cross_references)) {
    para.cross_references.forEach(n => {
      if (state.cccMap[n]) refs.add(n);
    });
  }

  let seenCcc = 0;
  for (const el of elements) {
    if (el.type === 'ref-ccc') {
      seenCcc++;
      if (seenCcc > 1 && state.cccMap[el.ref_number] &&
          el.ref_number !== ownNumber) {
        refs.add(el.ref_number);
      }
    }
  }

  for (const el of elements) {
    if (el.type !== 'text' || !el.text) continue;
    scanForSectionRefs(el.text, ownNumber, refs);
  }

  const footnotes = page.footnotes || {};
  for (const el of elements) {
    if (el.type !== 'ref') continue;
    const fn = footnotes[el.number];
    if (!fn) continue;
    for (const r of (fn.refs || [])) {
      if (r.text) scanForSectionRefs(r.text, ownNumber, refs);
    }
  }

  return Array.from(refs).sort((a, b) => a - b);
}

function scanForSectionRefs(text, ownNumber, refs) {
  const re = /§\s*(\d{1,4})/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    const n = parseInt(m[1], 10);
    if (n !== ownNumber && state.cccMap[n]) refs.add(n);
  }
}

/* ------------------------------------------------------------------ *
 *  Tree
 * ------------------------------------------------------------------ */
function renderTree() {
  els.tree.innerHTML = '';
  const root = buildTree(state.data.toc_link_tree || []);
  els.tree.appendChild(root);
  for (const li of root.children) li.classList.remove('collapsed');
}

function buildTree(nodes) {
  const ul = document.createElement('ul');
  ul.className = 'tree';

  for (const n of nodes) {
    const li = document.createElement('li');
    li.dataset.id = n.id;

    const hasChildren = !!(n.children && n.children.length);
    if (hasChildren) li.classList.add('collapsed');

    const row = document.createElement('div');
    row.className = 'tree-row';

    const toggle = document.createElement('span');
    toggle.className = 'toggle';
    toggle.textContent = '▸';
    if (!hasChildren) toggle.style.visibility = 'hidden';
    row.appendChild(toggle);

    const label = document.createElement('span');
    label.className = 'tree-label';
    const toc = state.tocMap[n.id];
    label.textContent = toc ? toc.text : n.id;
    row.appendChild(label);

    if (state.pageMap[n.id]) row.classList.add('has-page');

    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      if (hasChildren) li.classList.toggle('collapsed');
    });

    row.addEventListener('click', () => {
      if (state.pageMap[n.id]) navigate(n.id);
      else if (hasChildren) li.classList.toggle('collapsed');
    });

    li.appendChild(row);
    if (hasChildren) li.appendChild(buildTree(n.children));
    ul.appendChild(li);
  }

  return ul;
}

function updateActiveTree() {
  document.querySelectorAll('.tree-row.active').forEach(r => r.classList.remove('active'));
  if (!state.currentId) return;

  const li = document.querySelector(`li[data-id="${cssEscape(state.currentId)}"]`);
  if (!li) return;

  const row = li.querySelector(':scope > .tree-row');
  if (row) {
    row.classList.add('active');
    row.scrollIntoView({ block: 'nearest' });
  }

  let p = li.parentElement;
  while (p && p.id !== 'tree-container') {
    if (p.tagName === 'LI') p.classList.remove('collapsed');
    p = p.parentElement;
  }
}

/* ------------------------------------------------------------------ *
 *  Navigation
 * ------------------------------------------------------------------ */
function navigate(id, opts = {}) {
  if (!state.pageMap[id]) return;

  closePreview();
  hideTooltip();
  closeParaMenu();

  state.currentId = id;
  renderPage(id, opts);
  updateActiveTree();
  updatePager();

  if (!opts.silentHash) {
    setLocation(id, 'pushState');
  }

  const content = document.getElementById('content');
  if (content) content.scrollTop = 0;

  updateDocumentTitle(id);
  if (window.innerWidth <= 860) closeSidebar();
}

function updateDocumentTitle(pageId) {
  const hl = els.page.querySelector('.para.highlight');
  if (hl && hl.dataset.paraIndex != null) {
    const idx = parseInt(hl.dataset.paraIndex, 10);
    const page = state.pageMap[pageId];
    const para = page && page.paragraphs ? page.paragraphs[idx] : null;
    if (para) {
      const n = getParaNumber(para);
      if (n != null) {
        document.title = 'CCC § ' + n + ' - ' + truncate(extractPlainText(para), 120);
        return;
      }
    }
  }
  document.title = (state.tocMap[pageId] ? state.tocMap[pageId].text : pageId) + ' — Catechism';
}

function navigateToEntry(entry) {
  const t = state.cccMap[entry.start];
  if (!t) return;
  if (entry.start === entry.end) {
    navigate(t.pageId, { highlightCcc: entry.start });
  } else {
    navigate(t.pageId, { highlightRange: entry });
  }
}

function updatePager() {
  if (!els.prev || !els.next || !els.pagerLabel) return;

  const i = state.order.indexOf(state.currentId);
  if (i < 0) {
    els.prev.disabled = true;
    els.next.disabled = true;
    els.pagerLabel.textContent = '';
    return;
  }

  const prevId = i > 0 ? state.order[i - 1] : null;
  const nextId = i < state.order.length - 1 ? state.order[i + 1] : null;

  els.prev.disabled = !prevId;
  els.next.disabled = !nextId;

  els.prev.textContent = prevId ? '← ' + truncate(labelFor(prevId), 34) : '← Previous';
  els.next.textContent = nextId ? truncate(labelFor(nextId), 34) + ' →' : 'Next →';

  els.pagerLabel.textContent = `${i + 1} / ${state.order.length}`;

  els.prev.onclick = () => { if (prevId) navigate(prevId); };
  els.next.onclick = () => { if (nextId) navigate(nextId); };
}

function labelFor(id) {
  const t = state.tocMap[id];
  return t ? t.text : id;
}

/* ------------------------------------------------------------------ *
 *  Page rendering
 * ------------------------------------------------------------------ */
function renderPage(id, opts = {}) {
  state.lastPageOpts = Object.assign({}, opts);

  const page = state.pageMap[id];
  const toc = state.tocMap[id];
  const frag = document.createDocumentFragment();

  const header = document.createElement('div');
  header.className = 'page-header';
  const h2 = document.createElement('h2');
  h2.textContent = toc ? toc.text : id;
  header.appendChild(h2);
  frag.appendChild(header);

  let highlightIndex = -1;
  if (opts.highlightCcc != null) {
    const t = state.cccMap[opts.highlightCcc];
    if (t && t.pageId === id) highlightIndex = t.paraIndex;
  }
  if (opts.paraIndex != null) highlightIndex = opts.paraIndex;

  const highlightRange = opts.highlightRange || null;

  const body = document.createElement('div');
  body.className = 'page-body';

  (page.paragraphs || []).forEach((p, pi) => {
    const pEl = document.createElement('p');
    pEl.className = 'para';
    pEl.dataset.paraIndex = String(pi);

    if (p.attrs && p.attrs.indent) pEl.classList.add('indent');

    const meaningful = (p.elements || []).filter(e => e.type !== 'spacer');
    const isHeading = meaningful.length > 0 && meaningful.every(e =>
      e.type === 'text' && e.attrs && e.attrs.heavy_header
    );
    const isSubheading = !isHeading && meaningful.length > 0 && meaningful.every(e =>
      e.type === 'text' && e.attrs && e.attrs.b
    );

    if (isHeading) pEl.classList.add('heading');
    else if (isSubheading) pEl.classList.add('subheading');

    let onlySpacers = true;
    for (const el of (p.elements || [])) {
      if (el.type !== 'spacer') onlySpacers = false;
      pEl.appendChild(renderElement(el, page, id));
    }

    if (onlySpacers) pEl.classList.add('blank');

    if (pi === highlightIndex) pEl.classList.add('highlight');
    if (highlightRange) {
      const n = getParaNumber(p);
      if (n != null && n >= highlightRange.start && n <= highlightRange.end) {
        pEl.classList.add('highlight');
      }
    }

    body.appendChild(pEl);

    if (!isHeading && !onlySpacers) {
      const ownNum = getParaNumber(p);

      const refEntries = collectReferencesFor(ownNum, page, p);
      if (refEntries.length) {
        body.appendChild(renderXrefLine(refEntries, 'See Also:', 'refs'));
      }

      const backEntries = getReferencedBy(ownNum);
      if (backEntries.length) {
        body.appendChild(renderXrefLine(backEntries, 'Cited In:', 'back'));
      }
    }
  });

  frag.appendChild(body);

  const footnotes = page.footnotes || {};
  const fnKeys = Object.keys(footnotes);
  if (fnKeys.length) {
    const sec = document.createElement('div');
    sec.className = 'footnotes';

    const h3 = document.createElement('h3');
    h3.textContent = 'Footnotes';
    sec.appendChild(h3);

    const ol = document.createElement('ol');
    for (const key of fnKeys) {
      const fn = footnotes[key];
      const li = document.createElement('li');
      li.id = `fn-${id}-${fn.number}`;

      const num = document.createElement('span');
      num.className = 'fn-num';
      num.textContent = fn.number + '. ';
      li.appendChild(num);

      (fn.refs || []).forEach((r, i) => {
        if (i) li.appendChild(document.createTextNode(' '));
        if (r.link) {
          const a = document.createElement('a');
          a.href = r.link;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = r.text;
          li.appendChild(a);
        } else {
          li.appendChild(document.createTextNode(r.text || ''));
        }
      });

      ol.appendChild(li);
    }
    sec.appendChild(ol);
    frag.appendChild(sec);
  }

  const refsLoaded = Object.keys(state.refsMap).length > 0;
  if (!refsLoaded) {
    const back = state.backlinks[id];
    if (back && back.size) {
      const sec = document.createElement('div');
      sec.className = 'backlinks';

      const h3 = document.createElement('h3');
      h3.textContent = 'Referenced by';
      sec.appendChild(h3);

      const ul = document.createElement('ul');
      for (const src of back) {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = '#/' + src;
        a.textContent = labelFor(src);
        a.addEventListener('click', (e) => { e.preventDefault(); navigate(src); });
        li.appendChild(a);
        ul.appendChild(li);
      }
      sec.appendChild(ul);
      frag.appendChild(sec);
    }
  }

  els.page.innerHTML = '';
  els.page.appendChild(frag);

  if (!opts.skipScroll && (highlightIndex >= 0 || highlightRange)) {
    setTimeout(() => {
      const target = els.page.querySelector('.para.highlight');
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 40);
  }
}

function renderXrefLine(entries, label, kind) {
  const div = document.createElement('div');
  div.className = 'see-also ' + (kind || '');

  const lab = document.createElement('span');
  lab.className = 'xref-label';
  lab.textContent = label + ' ';
  div.appendChild(lab);

  entries.forEach((entry, i) => {
    if (i) div.appendChild(document.createTextNode(', '));

    const target = state.cccMap[entry.start];
    const text = entry.start === entry.end
      ? String(entry.start)
      : entry.start + '–' + entry.end;

    if (!target) {
      const span = document.createElement('span');
      span.className = 'xref-missing';
      span.textContent = text;
      span.title = 'Paragraph not found in the loaded Catechism';
      div.appendChild(span);
      return;
    }

    const a = document.createElement('a');
    a.href = '#ccc-' + entry.start;
    a.textContent = text;
    a.setAttribute('aria-label', 'Preview CCC ' + text);

    a.addEventListener('mouseenter', () => showTooltip(a, entry));
    a.addEventListener('mouseleave', hideTooltip);
    a.addEventListener('focus', () => showTooltip(a, entry));
    a.addEventListener('blur', hideTooltip);

    a.addEventListener('click', (e) => {
      e.preventDefault();
      hideTooltip();
      openPreview(entry);
    });

    div.appendChild(a);
  });

  return div;
}

function renderElement(el, page, pageId) {
  switch (el.type) {
    case 'text': {
      const span = document.createElement('span');
      span.textContent = el.text;
      const a = el.attrs || {};
      if (a.b) span.classList.add('bold');
      if (a.i) span.classList.add('italic');
      if (a.heavy_header) span.classList.add('heavy');
      return span;
    }
    case 'spacer':
      return document.createElement('br');
    case 'ref': {
      const sup = document.createElement('sup');
      sup.className = 'fn-ref';
      sup.textContent = el.number;

      sup.setAttribute('aria-label', 'Footnote ' + el.number);

      const footnote = (page.footnotes || {})[el.number];

      const showFnTip = () => {
        if (footnote) showFootnoteTooltip(sup, footnote);
      };

      sup.addEventListener('mouseenter', showFnTip);
      sup.addEventListener('mouseleave', hideTooltip);
      sup.addEventListener('focus', showFnTip);
      sup.addEventListener('blur', hideTooltip);

      sup.addEventListener('click', () => {
        hideTooltip();
        const target = document.getElementById(`fn-${pageId}-${el.number}`);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          target.classList.add('flash');
          setTimeout(() => target.classList.remove('flash'), 1800);
        }
      });

      return sup;
    }
    case 'ref-ccc': {
      const a = document.createElement('a');
      a.className = 'ccc-ref';
      a.href = 'javascript:void(0)';
      a.textContent = el.ref_number;
      a.setAttribute('aria-label', 'Go to CCC ' + el.ref_number);
      a.addEventListener('click', (e) => {
        e.preventDefault();

        // If this paragraph is already highlighted and this link is the
        // paragraph's own leading number, clicking just clears the
        // highlight instead of re-navigating.
        const para = a.closest('.para.highlight');
        if (para && para.querySelector('a.ccc-ref') === a) {
          para.classList.remove('highlight');
          if (state.lastPageOpts) {
            delete state.lastPageOpts.highlightCcc;
            delete state.lastPageOpts.paraIndex;
            delete state.lastPageOpts.highlightRange;
          }
          updateDocumentTitle(state.currentId);
          return;
        }

        const t = state.cccMap[el.ref_number];
        if (t) navigate(t.pageId, { highlightCcc: el.ref_number });
      });
      return a;
    }
    case 'ref-anchor': {
      const a = document.createElement('a');
      a.className = 'anchor-ref';
      a.href = el.link || '#';
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = '↗';
      a.title = 'Open referenced text';
      return a;
    }
    default:
      return document.createTextNode('');
  }
}

/* ------------------------------------------------------------------ *
 *  Tooltip preview
 * ------------------------------------------------------------------ */
function ensureTooltip() {
  if (!tooltipEl) {
    tooltipEl = $('#tooltip');
  }
  return tooltipEl;
}

function entryLabel(entry) {
  return entry.start === entry.end
    ? 'CCC ' + entry.start
    : 'CCC ' + entry.start + '–' + entry.end;
}

function showTooltip(anchor, entry) {
  const target = state.cccMap[entry.start];
  if (!target) return;
  const page = state.pageMap[target.pageId];
  const para = page.paragraphs[target.paraIndex];
  if (!para) return;

  const tip = ensureTooltip();
  tip.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'tooltip-header';
  header.textContent = entryLabel(entry);
  tip.appendChild(header);

  const body = document.createElement('div');
  body.textContent = truncate(extractPlainText(para), 300);
  tip.appendChild(body);

  if (entry.start !== entry.end) {
    const note = document.createElement('div');
    note.className = 'tooltip-note';
    note.textContent = 'Range — showing the first paragraph.';
    tip.appendChild(note);
  }

  tip.classList.add('show');
  positionTooltip(anchor);
}

function showFootnoteTooltip(anchor, footnote) {
  const tip = ensureTooltip();
  tip.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'tooltip-header';
  header.textContent = 'Footnote ' + footnote.number;
  tip.appendChild(header);

  const body = document.createElement('div');
  const text = (footnote.refs || [])
    .map(r => (r && r.text) ? r.text : '')
    .join(' ')
    .replace(/\s+/g, ' ')
    .trim();
  body.textContent = truncate(text, 400);
  tip.appendChild(body);

  tip.classList.add('show');
  positionTooltip(anchor);
}

function positionTooltip(anchor) {
  if (!tooltipEl) return;
  const rect = anchor.getBoundingClientRect();
  const tip = tooltipEl;
  tip.style.visibility = 'hidden';
  tip.style.left = '0px';
  tip.style.top = '0px';
  const tr = tip.getBoundingClientRect();
  let left = rect.left;
  let top = rect.bottom + 6;
  if (left + tr.width > window.innerWidth - 10) left = window.innerWidth - tr.width - 10;
  if (left < 10) left = 10;
  if (top + tr.height > window.innerHeight - 10) {
    top = rect.top - tr.height - 6;
    if (top < 10) top = 10;
  }
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
  tip.style.visibility = '';
}

function hideTooltip() {
  if (tooltipEl) tooltipEl.classList.remove('show');
}

function extractPlainText(para) {
  return (para.elements || [])
    .filter(el => el.type === 'text')
    .map(el => el.text)
    .join('')
    .replace(/\s+/g, ' ')
    .trim();
}

/* ------------------------------------------------------------------ *
 *  Right-hand preview pane
 * ------------------------------------------------------------------ */
function openPreview(entry) {
  const target = state.cccMap[entry.start];
  if (!target) return;
  const page = state.pageMap[target.pageId];
  const para = page.paragraphs[target.paraIndex];
  if (!para) return;

  els.previewTitle.textContent = entryLabel(entry);
  els.previewBody.innerHTML = '';

  els.previewBody.appendChild(renderPreviewParagraph(para, page));

  if (entry.start !== entry.end) {
    const note = document.createElement('p');
    note.className = 'preview-note';
    note.textContent = 'Showing the first paragraph of this range.';
    els.previewBody.appendChild(note);
  }

  const open = document.createElement('a');
  open.href = '#ccc-' + entry.start;
  open.className = 'open-full';
  open.textContent = 'Open in context →';
  open.addEventListener('click', (e) => {
    e.preventDefault();
    closePreview();
    navigateToEntry(entry);
  });
  els.previewBody.appendChild(open);

  els.previewPane.classList.add('open');
  els.previewBody.scrollTop = 0;
}

function closePreview() {
  if (els.previewPane) els.previewPane.classList.remove('open');
}

function renderPreviewParagraph(para, page) {
  const pEl = document.createElement('p');
  pEl.className = 'para';
  if (para.attrs && para.attrs.indent) pEl.classList.add('indent');

  const elements = Array.isArray(para.elements) ? para.elements : [];
  let start = 0;
  if (elements[0] && elements[0].type === 'ref-ccc') start = 1;

  for (let i = start; i < elements.length; i++) {
    const el = elements[i];
    if (el.type === 'ref') continue;
    pEl.appendChild(renderElement(el, page, page.id));
  }
  return pEl;
}

/* ------------------------------------------------------------------ *
 *  Advanced search
 * ------------------------------------------------------------------ */

/* ---- Regex helpers ---- */
function escapeRegExp(s) {
  return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function buildTermSource(term, opts) {
  const esc = escapeRegExp(term);
  if (opts.match === 'whole') {
    const start = /^\w/.test(term) ? '\\b' : '';
    const end   = /\w$/.test(term) ? '\\b' : '';
    return start + esc + end;
  }
  return esc;
}

function buildMatcher(raw, opts) {
  if (!raw) return null;
  const flags = opts.caseSensitive ? 'g' : 'gi';

  if (opts.match === 'regex') {
    try {
      const re = new RegExp(raw, flags);
      return {
        test(text) { re.lastIndex = 0; return re.test(text); },
      };
    } catch (e) {
      return { error: 'Invalid regular expression: ' + e.message };
    }
  }

  let terms;
  if (opts.logic === 'phrase') terms = [raw];
  else terms = raw.split(/\s+/).filter(Boolean);
  if (!terms.length) return null;

  const regexes = terms.map(t => new RegExp(buildTermSource(t, opts), flags));
  const requireAll = opts.logic !== 'any';

  return {
    test(text) {
      if (requireAll) {
        return regexes.every(re => { re.lastIndex = 0; return re.test(text); });
      }
      return regexes.some(re => { re.lastIndex = 0; return re.test(text); });
    },
  };
}

function buildHighlighter(raw, opts) {
  const flags = opts.caseSensitive ? 'g' : 'gi';

  if (opts.match === 'regex') {
    try { return new RegExp(raw, flags); } catch (e) { return null; }
  }

  let terms;
  if (opts.logic === 'phrase') terms = [raw];
  else terms = raw.split(/\s+/).filter(Boolean);
  if (!terms.length) return null;

  const sources = terms
    .slice()
    .sort((a, b) => b.length - a.length)
    .map(t => buildTermSource(t, opts));

  return new RegExp(sources.join('|'), flags);
}

function makeAdvancedSnippet(text, highlighter) {
  if (!highlighter) return escapeHtml(text.slice(0, 200));

  highlighter.lastIndex = 0;
  let first = null;
  try { first = highlighter.exec(text); } catch (e) { first = null; }

  let start = 0;
  let end = Math.min(text.length, 200);
  if (first) {
    const matchLen = first[0].length || 1;
    start = Math.max(0, first.index - 55);
    end = Math.min(text.length, first.index + matchLen + 75);
  }

  const slice = text.slice(start, end);
  highlighter.lastIndex = 0;

  let out = '';
  let last = 0;
  let m;
  let safety = 0;

  while ((m = highlighter.exec(slice)) !== null && safety++ < 500) {
    if (m.index > last) out += escapeHtml(slice.slice(last, m.index));
    if (m[0].length === 0) {
      out += escapeHtml(slice[m.index] || '');
      last = m.index + 1;
      highlighter.lastIndex = last;
      continue;
    }
    out += '<mark>' + escapeHtml(m[0]) + '</mark>';
    last = m.index + m[0].length;
  }
  if (last < slice.length) out += escapeHtml(slice.slice(last));

  return (start > 0 ? '…' : '') + out + (end < text.length ? '…' : '');
}

/* ---- Search UI wiring ---- */

function toggleAdvanced() {
  const opening = els.advPanel.hidden;
  els.advPanel.hidden = !opening;
  els.advToggle.classList.toggle('active', opening);
  els.advToggle.setAttribute('aria-expanded', String(opening));
  if (opening && els.searchDropdown) els.searchDropdown.scrollTop = 0;
  syncDropdown();
}

function syncDropdown() {
  const resultsOpen = els.searchResults.classList.contains('open');
  const advOpen = els.advPanel && !els.advPanel.hidden;
  els.searchDropdown.classList.toggle('open', resultsOpen || advOpen);
}

function onAdvancedChange() {
  syncAdvancedHint();
  const q = els.search.value.trim();
  if (q) performSearch(q);
  else syncDropdown();
}

function syncAdvancedHint() {
  if (!els.advHint) return;
  const o = state.searchOpts;
  let text;
  if (o.match === 'regex') {
    text = 'Regex mode: the whole query is a JavaScript regular expression. Multi-word options are ignored.';
  } else if (o.logic === 'phrase') {
    text = o.match === 'whole'
      ? 'Finds the exact phrase as whole words.'
      : 'Finds the exact phrase anywhere in the text.';
  } else if (o.logic === 'all') {
    text = o.match === 'whole'
      ? 'Finds paragraphs containing every word as whole words.'
      : 'Finds paragraphs containing every word (as substrings).';
  } else {
    text = o.match === 'whole'
      ? 'Finds paragraphs containing any of the words as whole words.'
      : 'Finds paragraphs containing any of the words (as substrings).';
  }
  if (o.caseSensitive) text += ' Case-sensitive.';
  els.advHint.textContent = text;

  if (els.advLogicGroup) {
    els.advLogicGroup.classList.toggle('disabled', o.match === 'regex');
  }

  if (els.advToggle) {
    const active = o.match !== 'contains' || o.logic !== 'all' || o.caseSensitive;
    els.advToggle.classList.toggle('has-active', active);
  }
}

function bindAdvancedSearch() {
  if (!els.advToggle) return;

  els.advToggle.addEventListener('click', toggleAdvanced);

  document.querySelectorAll('#advanced-search [data-match]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.searchOpts.match = btn.dataset.match;
      document.querySelectorAll('#advanced-search [data-match]')
        .forEach(b => b.classList.toggle('active', b === btn));
      onAdvancedChange();
    });
  });

  document.querySelectorAll('#advanced-search [data-logic]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.searchOpts.logic = btn.dataset.logic;
      document.querySelectorAll('#advanced-search [data-logic]')
        .forEach(b => b.classList.toggle('active', b === btn));
      onAdvancedChange();
    });
  });

  const caseBox = $('#adv-case');
  if (caseBox) {
    caseBox.addEventListener('change', () => {
      state.searchOpts.caseSensitive = caseBox.checked;
      onAdvancedChange();
    });
  }

  syncAdvancedHint();
}

/* ---- Search execution ---- */

function onSearchInput() {
  const q = els.search.value.trim();
  clearTimeout(searchTimer);
  if (!q) {
    els.searchResults.classList.remove('open');
    syncDropdown();
    return;
  }
  searchTimer = setTimeout(() => performSearch(q), 110);
}

function performSearch(q) {
  const results = [];
  const MAX = 60;
  const opts = state.searchOpts;
  const trimmed = q.trim();

  if (opts.match !== 'regex' && /^\d+$/.test(trimmed)) {
    const n = parseInt(trimmed, 10);
    if (state.cccMap[n]) {
      results.push({
        type: 'ccc', ccc: n,
        pageId: state.cccMap[n].pageId,
        paraIndex: state.cccMap[n].paraIndex,
      });
    }
  }

  const matcher = buildMatcher(trimmed, opts);

  if (matcher && matcher.error) {
    renderSearchResults([{ type: 'error', message: matcher.error }], q);
    return;
  }
  if (!matcher) {
    renderSearchResults(results, q);
    return;
  }

  const highlighter = buildHighlighter(trimmed, opts);

  outer:
  for (const id of state.order) {
    const paras = state.searchData[id] || [];
    for (const p of paras) {
      if (matcher.test(p.text)) {
        results.push({
          type: 'text', pageId: id, paraIndex: p.idx,
          snippet: makeAdvancedSnippet(p.text, highlighter),
        });
        if (results.length >= MAX) break outer;
      }
    }
  }

  renderSearchResults(results, q);
}

function renderSearchResults(results, q) {
  const box = els.searchResults;
  box.innerHTML = '';

  const err = results.find(r => r.type === 'error');
  if (err) {
    const item = document.createElement('div');
    item.className = 'sr-empty';
    item.textContent = err.message;
    box.appendChild(item);
    box.classList.add('open');
    syncDropdown();
    return;
  }

  if (!results.length) {
    const empty = document.createElement('div');
    empty.className = 'sr-empty';
    empty.textContent = 'No results for “' + q + '”.';
    box.appendChild(empty);
    box.classList.add('open');
    syncDropdown();
    return;
  }

  const header = document.createElement('div');
  header.className = 'sr-header';
  header.textContent = results.length + (results.length >= 60 ? '+' : '') +
    ' result' + (results.length === 1 ? '' : 's');
  box.appendChild(header);

  for (const r of results) {
    const item = document.createElement('div');
    item.className = 'sr-item';
    item.setAttribute('role', 'option');

    const title = document.createElement('div');
    title.className = 'sr-title';
    title.textContent = labelFor(r.pageId);
    item.appendChild(title);

    const snippet = document.createElement('div');
    snippet.className = 'sr-snippet';
    if (r.type === 'ccc') {
      snippet.textContent = 'CCC paragraph ' + r.ccc;
    } else {
      snippet.innerHTML = r.snippet;
    }
    item.appendChild(snippet);

    item.addEventListener('click', () => {
      closeSearch();
      els.search.value = '';
      navigate(r.pageId, { paraIndex: r.paraIndex });
    });

    box.appendChild(item);
  }

  box.classList.add('open');
  syncDropdown();
}

function closeSearch() {
  els.searchResults.classList.remove('open');
  if (els.advPanel) els.advPanel.hidden = true;
  if (els.advToggle) {
    els.advToggle.classList.remove('active');
    els.advToggle.setAttribute('aria-expanded', 'false');
  }
  syncDropdown();
}

/* ------------------------------------------------------------------ *
 *  Paragraph context menu (right-click on a highlighted paragraph number)
 * ------------------------------------------------------------------ */
function ensureParaMenu() {
  if (paraMenuEl) return paraMenuEl;

  if (!document.getElementById('para-context-menu-style')) {
    const style = document.createElement('style');
    style.id = 'para-context-menu-style';
    style.textContent = `
      #para-context-menu {
        position: fixed; z-index: 120; min-width: 230px;
        background: var(--bg); border: 1px solid var(--border);
        border-radius: 9px; box-shadow: 0 12px 40px var(--shadow);
        padding: 5px; display: none; font-family: var(--sans);
        font-size: 0.84rem;
      }
      #para-context-menu.open { display: block; }
      #para-context-menu .pcm-header {
        padding: 6px 10px 7px; font-size: 0.7rem; text-transform: uppercase;
        letter-spacing: 0.06em; color: var(--muted); font-weight: 700;
        border-bottom: 1px solid var(--border); margin-bottom: 4px;
      }
      #para-context-menu button {
        display: block; width: 100%; text-align: left; background: none;
        border: none; color: var(--text); padding: 8px 10px; border-radius: 6px;
        font-family: var(--sans); font-size: 0.84rem; cursor: pointer;
      }
      #para-context-menu button:hover,
      #para-context-menu button:focus-visible {
        background: var(--bg-alt); color: var(--accent); outline: none;
      }
      #para-context-menu .pcm-status {
        padding: 7px 10px 3px; font-size: 0.75rem; color: var(--muted);
      }
    `;
    document.head.appendChild(style);
  }

  const menu = document.createElement('div');
  menu.id = 'para-context-menu';
  menu.setAttribute('role', 'menu');
  menu.innerHTML =
    '<div class="pcm-header" role="presentation"></div>' +
    '<button type="button" role="menuitem" data-action="link">Copy link to paragraph</button>' +
    '<button type="button" role="menuitem" data-action="text">Copy text</button>' +
    '<button type="button" role="menuitem" data-action="number">Copy paragraph number</button>' +
    '<div class="pcm-status" role="status" aria-live="polite" hidden></div>';

  menu.addEventListener('contextmenu', (e) => e.preventDefault());

  menu.addEventListener('click', (e) => {
    const btn = e.target.closest ? e.target.closest('button[data-action]') : null;
    if (!btn || !paraMenuTarget) return;

    const { n, paraEl } = paraMenuTarget;
    let payload = '';

    if (btn.dataset.action === 'link') payload = buildParaLink(n);
    else if (btn.dataset.action === 'number') payload = String(n);
    else if (btn.dataset.action === 'text') payload = paragraphText(paraEl);

    copyToClipboard(payload).then((ok) => {
      const status = menu.querySelector('.pcm-status');
      if (status) {
        status.hidden = false;
        status.textContent = ok ? 'Copied!' : 'Copy failed';
      }
      setTimeout(closeParaMenu, ok ? 650 : 1200);
    });
  });

  document.body.appendChild(menu);
  paraMenuEl = menu;
  return menu;
}

function openParaMenu(x, y, n, paraEl) {
  const menu = ensureParaMenu();
  paraMenuTarget = { n, paraEl };

  const header = menu.querySelector('.pcm-header');
  if (header) header.textContent = 'CCC ' + n;

  const status = menu.querySelector('.pcm-status');
  if (status) { status.hidden = true; status.textContent = ''; }

  menu.classList.add('open');
  menu.style.left = '0px';
  menu.style.top = '0px';

  const r = menu.getBoundingClientRect();
  let left = x;
  let top = y;
  if (left + r.width > window.innerWidth - 8) left = window.innerWidth - r.width - 8;
  if (left < 8) left = 8;
  if (top + r.height > window.innerHeight - 8) top = y - r.height;
  if (top < 8) top = 8;

  menu.style.left = left + 'px';
  menu.style.top = top + 'px';
}

function closeParaMenu() {
  if (paraMenuEl) paraMenuEl.classList.remove('open');
  paraMenuTarget = null;
}

function onPageContextMenu(e) {
  const target = e.target;
  const a = target && target.closest ? target.closest('a.ccc-ref') : null;
  if (!a) return;

  const paraEl = a.closest('.para.highlight');
  if (!paraEl) return;

  if (paraEl.querySelector('a.ccc-ref') !== a) return;

  const n = parseInt(a.textContent, 10);
  if (!Number.isFinite(n)) return;

  e.preventDefault();
  hideTooltip();
  openParaMenu(e.clientX, e.clientY, n, paraEl);
}

/* ------------------------------------------------------------------ *
 *  Embedder support
 * ------------------------------------------------------------------ */

/**
 * Raw ?embed= value passed by an embedding page. Cached on first read
 * so that the value survives even if the query string is later stripped
 * by in-app navigation. Returns null when the page is opened directly.
 */
function getEmbedRaw() {
  if (state.embedRaw !== undefined) return state.embedRaw;
  try {
    state.embedRaw = new URLSearchParams(location.search).get('embed') || null;
  } catch (e) {
    state.embedRaw = null;
  }
  return state.embedRaw;
}

/**
 * Parsed, validated embedder URL. Returns null when absent or when the
 * scheme is not http(s) — protects against `javascript:` and friends.
 * Returns a fresh URL object each call; callers may mutate freely.
 */
function getEmbedUrl() {
  const raw = getEmbedRaw();
  if (!raw) return null;
  try {
    const u = new URL(raw);
    if (u.protocol !== 'http:' && u.protocol !== 'https:') return null;
    return u;
  } catch (e) {
    return null;
  }
}

/**
 * Build a link to paragraph `n`. Prefers the embedder URL (so the link
 * points back at the embedding page) but preserves its hash — the
 * embedder may need it for its own routing. Falls back to this
 * document's URL when not embedded.
 */
function buildParaLink(n) {
  const embed = getEmbedUrl();
  if (embed) {
    // Preserve the embedder's hash: they may use it for their own routing.
    // Query params (utm, etc.) are preserved; only `p` is (re)set.
    embed.searchParams.set('p', String(n));
    return embed.href;
  }
  try {
    const u = new URL(location.href);
    u.hash = '';
    u.searchParams.set('p', String(n));
    return u.href;
  } catch (e) {
    return location.href.split('#')[0] + '?p=' + encodeURIComponent(n);
  }
}

function paragraphText(paraEl) {
  const idx = parseInt(paraEl.dataset.paraIndex, 10);
  const page = state.currentId ? state.pageMap[state.currentId] : null;
  const para = page && page.paragraphs ? page.paragraphs[idx] : null;

  if (!para) return (paraEl.textContent || '').replace(/\s+/g, ' ').trim();

  let out = '';
  const append = (s) => {
    if (!s) return;
    if (out && /\w$/.test(out) && /^\w/.test(s)) out += ' ';
    out += s;
  };

  for (const el of (para.elements || [])) {
    if (el.type === 'text') append(el.text || '');
    else if (el.type === 'ref-ccc') append(String(el.ref_number));
    else if (el.type === 'spacer') append(' ');
  }
  return out.replace(/\s+/g, ' ').trim();
}

async function copyToClipboard(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fall through */ }

  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) {
    return false;
  }
}

/* ------------------------------------------------------------------ *
 *  UI events
 * ------------------------------------------------------------------ */
function bindUI() {
  els.search.addEventListener('input', onSearchInput);

  els.search.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const first = els.searchResults.querySelector('.sr-item');
      if (first) { e.preventDefault(); first.click(); }
    } else if (e.key === 'Escape') {
      els.search.value = '';
      closeSearch();
      els.search.blur();
    }
  });

  document.addEventListener('click', (e) => {
    if (!els.searchWrap.contains(e.target)) closeSearch();
    if (!paraMenuEl || !paraMenuEl.contains(e.target)) closeParaMenu();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !isTypingTarget(e.target)) {
      e.preventDefault();
      els.search.focus();
      els.search.select();
    }
    if (e.key === 'Escape') {
      if (els.themeModal && !els.themeModal.hidden) {
        closeThemeDialog();
        return;
      }
      closeSearch();
      closeParaMenu();
      hideTooltip();
      closePreview();
    }
  });

  els.menuToggle.addEventListener('click', () => {
    els.sidebar.classList.toggle('open');
    els.backdrop.classList.toggle('show', els.sidebar.classList.contains('open'));
  });

  els.backdrop.addEventListener('click', closeSidebar);

  /* ---- Paragraph context menu ---- */
  els.page.addEventListener('contextmenu', onPageContextMenu);
  document.addEventListener('scroll', closeParaMenu, true);
  window.addEventListener('resize', closeParaMenu);
  window.addEventListener('blur', closeParaMenu);

  /* ---- Theme dialog ---- */
  els.themeBtn.addEventListener('click', openThemeDialog);
  $('#theme-close').addEventListener('click', closeThemeDialog);
  $('#theme-done').addEventListener('click', closeThemeDialog);
  els.themeModal.querySelector('.modal-backdrop').addEventListener('click', closeThemeDialog);

  els.modeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      if (state.themeMode === btn.dataset.mode) return;
      state.themeMode = btn.dataset.mode;
      applyTheme();
    });
  });

  els.bgRange.addEventListener('input', onBgSlider);
  els.bgNumber.addEventListener('input', onBgNumberInput);
  els.bgNumber.addEventListener('change', onBgNumberCommit);
  els.bgNumber.addEventListener('blur', onBgNumberCommit);

  els.hueRange.addEventListener('input', onHueSlider);
  els.hueNumber.addEventListener('input', onHueNumberInput);
  els.hueNumber.addEventListener('change', onHueNumberCommit);
  els.hueNumber.addEventListener('blur', onHueNumberCommit);

  /* ---- Advanced search ---- */
  bindAdvancedSearch();

  /* ---- Preview ---- */
  $('#preview-close').addEventListener('click', closePreview);

  window.addEventListener('popstate', (e) => {
    const id = (e.state && e.state.id) || parseHashId();
    if (id && state.pageMap[id] && id !== state.currentId) {
      navigate(id, { silentHash: true });
    }
  });

  window.addEventListener('scroll', hideTooltip, { passive: true });
}

function closeSidebar() {
  els.sidebar.classList.remove('open');
  els.backdrop.classList.remove('show');
}

function isTypingTarget(el) {
  if (!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
}

/* ------------------------------------------------------------------ *
 *  Hash routing
 * ------------------------------------------------------------------ */

/** Read ?p=<integer> from the query string. Returns null if absent/invalid. */
function parseParagraphQuery() {
  try {
    const raw = new URLSearchParams(location.search).get('p');
    if (!raw) return null;
    const s = raw.trim();
    if (!/^\d+$/.test(s)) return null;
    const n = parseInt(s, 10);
    return Number.isFinite(n) ? n : null;
  } catch (e) {
    return null;
  }
}

/**
 * Update the address bar to `?<preserved-query>#/<id>`, stripping the
 * consumed `?p=` but preserving the embedder `?embed=`. `mode` is
 * 'pushState' or 'replaceState'. Falls back to a hash-only URL if the
 * URL constructor is unavailable or throws.
 */
function setLocation(id, mode) {
  try {
    const u = new URL(location.href);
    u.hash = '#/' + id;
    u.searchParams.delete('p');
    const raw = getEmbedRaw();
    if (raw) u.searchParams.set('embed', raw);
    history[mode]({ id }, '', u.href);
  } catch (e) {
    try { history[mode]({ id }, '', '#/' + id); } catch (e2) { /* ignore */ }
  }
}

function replaceHashAndClearP(id) {
  setLocation(id, 'replaceState');
}

function routeInitial() {
  // ?p=<n> deep link — jump to that CCC paragraph and highlight it.
  // The ?embed= parameter (if present) is preserved across the URL rewrite.
  const pNum = parseParagraphQuery();
  if (pNum != null) {
    const t = state.cccMap[pNum];
    if (t) {
      navigate(t.pageId, { highlightCcc: pNum, silentHash: true });
      replaceHashAndClearP(t.pageId);
      return;
    }
    // Paragraph not present in this data set — fall through to normal routing
  }

  const hash = location.hash;

  let m = hash.match(/^#\/(.+)$/);
  if (m && state.pageMap[m[1]]) {
    navigate(m[1], { silentHash: true });
    replaceHash(m[1]);
    return;
  }

  m = hash.match(/^#ccc-(\d+)$/);
  if (m) {
    const n = parseInt(m[1], 10);
    const t = state.cccMap[n];
    if (t) {
      navigate(t.pageId, { highlightCcc: n, silentHash: true });
      replaceHash(t.pageId);
      return;
    }
  }

  if (state.order.length) {
    navigate(state.order[0], { silentHash: true });
    replaceHash(state.order[0]);
  }
}

function parseHashId() {
  const m = location.hash.match(/^#\/(.+)$/);
  return m ? m[1] : null;
}

function replaceHash(id) {
  setLocation(id, 'replaceState');
}

/* ------------------------------------------------------------------ *
 *  Theme
 * ------------------------------------------------------------------ */
const THEME_KEY    = 'ccc-theme';
const CONTRAST_KEY = 'ccc-contrast';
const HUE_KEY      = 'ccc-hue';

// Transparency of the highlight color
const HIGHLIGHT_ALPHA_LIGHT = 0.5;
const HIGHLIGHT_ALPHA_DARK  = 0.5;

function clampNum(n, lo, hi) { return Math.min(hi, Math.max(lo, n)); }
function clampByte(n) { return Math.min(255, Math.max(0, n)); }

function readInt(input) {
  if (!input) return null;
  const raw = String(input.value).trim();
  if (!raw || !/^[+-]?\d+$/.test(raw)) return null;
  const n = parseInt(raw, 10);
  return Number.isFinite(n) ? n : null;
}

function setupTheme() {
  const savedMode = localStorage.getItem(THEME_KEY);
  const prefersDark = window.matchMedia &&
    window.matchMedia('(prefers-color-scheme: dark)').matches;

  state.themeMode = (savedMode === 'light' || savedMode === 'dark')
    ? savedMode
    : (prefersDark ? 'dark' : 'light');

  // Defaults live in the stylesheet (`:root { --default-hue; --default-contrast }`)
  // so pre-JS paint and post-JS theme agree. A saved preference wins.
  const defaultHue      = clampNum(getCssInt('--default-hue', 30), 0, 360);
  const defaultContrast = clampNum(getCssInt('--default-contrast', 0), 0, 100);

  const savedContrast = parseInt(localStorage.getItem(CONTRAST_KEY), 10);
  state.contrast = Number.isFinite(savedContrast)
    ? clampNum(savedContrast, 0, 100) : defaultContrast;

  const savedHue = parseInt(localStorage.getItem(HUE_KEY), 10);
  state.hue = Number.isFinite(savedHue) ? clampNum(savedHue, 0, 360) : defaultHue;

  applyTheme();
}

function applyTheme() {
  const root = document.documentElement;
  const dark = state.themeMode === 'dark';
  root.dataset.theme = state.themeMode;

  const h = state.hue;
  const t = state.contrast / 100;

  // Every surface is derived from the accent hue. As contrast rises,
  // backgrounds collapse toward pure black/white and text brightens
  // toward pure white/black, so max contrast = fully white-on-black
  // (dark) or black-on-white (light).
  const hsl = (s, l) =>
    `hsl(${h}, ${Math.round(s * 10) / 10}%, ${Math.round(l * 10) / 10}%)`;
  const hsla = (s, l, a) =>
    `hsla(${h}, ${Math.round(s * 10) / 10}%, ${Math.round(l * 10) / 10}%, ${a})`;

  let bg, alt, side, text, muted, border, accent, accentSoft, highlight, shadow;

  if (dark) {
    const bgL = 14 - t * 14;              // 14% → 0%
    const bgS = 32 - t * 32;              // 32% → 0%
    bg   = hsl(bgS, bgL);
    alt  = hsl(bgS * 0.9, bgL + 4);
    side = alt;

    const textL = 66 + t * 34;            // 66% → 100%
    const textS = 20 - t * 20;            // 20% → 0%
    text   = hsl(textS, textL);
    muted  = hsl(12 - t * 12, 52 + t * 30);
    border = hsl(24, 26 + t * 20);

    accent     = hsl(60, 64 + t * 18);
    accentSoft = hsl(26, 18 - t * 8);
    highlight  = hsla(55, 30, HIGHLIGHT_ALPHA_DARK);
    shadow     = `rgba(0, 0, 0, ${(0.55 + t * 0.35).toFixed(2)})`;
  } else {
    const bgL = 96 - t * 4;               // 96% → 100%
    const bgS = 55 - t * 55;              // 55% → 0%
    bg   = hsl(bgS, bgL);
    alt  = hsl(bgS * 0.9, bgL - 3);
    side = alt;

    const textL = 30 - t * 30;            // 30% → 0%
    const textS = 25 - t * 25;            // 25% → 0%
    text   = hsl(textS, textL);
    muted  = hsl(14, 46 - t * 12);
    border = hsl(20, 82 - t * 32);

    accent     = hsl(65, 34 - t * 14);
    accentSoft = hsl(45, 92 - t * 6);
    highlight  = hsla(85, 80, HIGHLIGHT_ALPHA_LIGHT);
    shadow     = `rgba(0, 0, 0, ${(0.14 + t * 0.12).toFixed(2)})`;
  }

  const style = root.style;
  style.setProperty('--bg', bg);
  style.setProperty('--bg-alt', alt);
  style.setProperty('--sidebar-bg', side);
  style.setProperty('--text', text);
  style.setProperty('--muted', muted);
  style.setProperty('--border', border);
  style.setProperty('--accent', accent);
  style.setProperty('--accent-soft', accentSoft);
  style.setProperty('--highlight', highlight);
  style.setProperty('--shadow', shadow);

  try {
    localStorage.setItem(THEME_KEY, state.themeMode);
    localStorage.setItem(CONTRAST_KEY, String(state.contrast));
    localStorage.setItem(HUE_KEY, String(state.hue));
  } catch (e) { /* storage may be unavailable */ }

  syncThemeControls();
}

function syncThemeControls() {
  if (!els.bgRange) return;

  els.bgRange.value = state.contrast;
  els.hueRange.value = state.hue;
  els.bgNumber.value = state.contrast;
  els.hueNumber.value = state.hue;

  if (els.modeButtons) {
    els.modeButtons.forEach(btn => {
      const active = btn.dataset.mode === state.themeMode;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-pressed', String(active));
    });
  }
}

function onBgSlider() {
  const n = readInt(els.bgRange);
  state.contrast = clampNum(n == null ? 0 : n, 0, 100);
  applyTheme();
}

function onBgNumberInput() {
  const n = readInt(els.bgNumber);
  if (n == null) return;
  state.contrast = clampNum(n, 0, 100);
  applyTheme();
}

function onBgNumberCommit() {
  const n = readInt(els.bgNumber);
  state.contrast = clampNum(n == null ? state.contrast : n, 0, 100);
  applyTheme();
}

function onHueSlider() {
  const n = readInt(els.hueRange);
  state.hue = clampNum(n == null ? 0 : n, 0, 360);
  applyTheme();
}

function onHueNumberInput() {
  const n = readInt(els.hueNumber);
  if (n == null) return;
  state.hue = clampNum(n, 0, 360);
  applyTheme();
}

function onHueNumberCommit() {
  const n = readInt(els.hueNumber);
  state.hue = clampNum(n == null ? state.hue : n, 0, 360);
  applyTheme();
}

function openThemeDialog() {
  if (!els.themeModal || !els.themeModal.hidden) return;
  els.themeModal.hidden = false;
  syncThemeControls();
  const focusTarget = els.themeModal.querySelector('.segmented button.active') || els.bgRange;
  if (focusTarget) focusTarget.focus();
}

function closeThemeDialog() {
  if (!els.themeModal || els.themeModal.hidden) return;
  els.themeModal.hidden = true;
  if (els.themeBtn) els.themeBtn.focus();
}

/* ------------------------------------------------------------------ *
 *  Utilities
 * ------------------------------------------------------------------ */
function truncate(s, n) {
  if (!s) return '';
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;',
  }[c]));
}

function cssEscape(s) {
  if (window.CSS && CSS.escape) return CSS.escape(s);
  return String(s).replace(/[^a-zA-Z0-9_-]/g, ch => '\\' + ch);
}

/**
 * Read an integer value from a CSS custom property defined on :root.
 * Returns `fallback` when the variable is missing or non-numeric. Used
 * so `--default-hue` / `--default-contrast` in the stylesheet are the
 * single source of truth for theme defaults.
 */
function getCssInt(name, fallback) {
  try {
    const v = getComputedStyle(document.documentElement)
      .getPropertyValue(name).trim();
    const n = parseInt(v, 10);
    return Number.isFinite(n) ? n : fallback;
  } catch (e) {
    return fallback;
  }
}
